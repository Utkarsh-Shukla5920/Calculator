<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Made By Utkarsh</title>
</head>
<body>
    <div class="headtxt">
    <h1>Utkarsh-Calculator</h1>
</div>
         <div class="container">
        <div class="calculator">
            <input type="text" placeholder="0" id="inputbox">
            <div>
            <button class="operator">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
            </div>


            <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
            </div>

            <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            </div>

            <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            </div>

            <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalbtn">=</button>
            </div>
            <div>
              <button id="historybtn">History</button>
               </div>

                     <div id="historybox" style="display: none;">
                    <h3>Calculation History</h3>
                    <ul id="history-list"></ul>
                    </div>
        </div>

        
        </div>

        <script src="script.js"></script>
        <footer>
            <br>
            <h1>Thanks for using my Calculator</h1>
            
                <hr class="fline">
                <h4>Copyright :- Made By Utkarsh</h4>
                <br>
         </footer>
</body>
</html>
